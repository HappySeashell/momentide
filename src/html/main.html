<div id="artitalk_part1">
  <div id="shuoshuo_content">
    <div id="ccontent"></div>
    <div id="readButton"><center><button id="readmore" class="at_button" style="margin-bottom: 15px; display: none">{{loadMore}}</button></center></div>
  </div>
  <div id="shuoshuo_input" class="shuoshuo_active" style="display: none">
    <div id="shuoshuo_edit">
      <textarea class="shuoshuo_text" oninput="preview()" id="neirong" placeholder="{{shuoPla}}" style="background-image: url({{bgImg}}); z-index: 0"></textarea>
      <span id="drag_area" class="z-index: -1;"></span>
    </div>
    <div id="shuoshuo_parttwo" class="shuoshuo_parttwo">
      <div id="shuoshuo_emoji_Tieba" class="shuoshuo_emoji" style="display: none"></div>
      <div id="shuoshuo_emoji_BiliBili" class="shuoshuo_emoji" style="display: none"></div>
      <div id="shuoshuo_emoji_QQ" class="shuoshuo_emoji" style="display: none"></div>
      <div id="shuoshuo_emoji_custom" class="shuoshuo_emoji" style="display: none"></div>
      <div id="shuoshuo_emojiswitch" class="shuoshuo_emojiswitch" style="display: none">
        <div id="switch_1" class="shuoshuo_emoji_part zuiliangdezai">Tieba</div><div id="switch_2" class="shuoshuo_emoji_part">BiliBili</div><div id="switch_3" class="shuoshuo_emoji_part">QQ</div><div id="switch_4" class="shuoshuo_emoji_part">Custom</div>
      </div>
      <div id="preview" class="preview_now"></div>
    </div>
    <div class="shuoshuo_submit"><div class="shuoshuo_row">
      <input class="artitalk_child shuoshuo_inputs" style="display: none" id="email" value="" placeholder="{{avatarUrl}}">
      <input class="artitalk_child shuoshuo_inputs" style="display: none" id="commentNick" value="" placeholder="{{avatarUrl}}">
      <input id="momentide-honeypot" value="" tabindex="-1" autocomplete="off" aria-hidden="true" style="position: absolute; left: -10000px; width: 1px; height: 1px">
      <div id="momentide-turnstile" class="artitalk_child" style="display: none"></div>
      <div class="artitalk_child"><button class="at_button" id="atSave" style="float: right">{{publish}}</button><button class="at_button" id="commentSave" style="display: none; float: right">{{publish}}</button><button class="at_button" id="atPreview" style="float: right">{{preview}}</button><button class="at_button" id="loadEmoji" style="float: right">{{emoji}}</button></div>
    </div></div>
  </div>
</div>
<div class="power">
  <div style="font-size: 25px; display: none; cursor: pointer" id="pubComment">{{publishSvg}}</div><div style="font-size: 25px; display: inline; cursor: pointer" id="pubShuo" title="{{postTalk}}">{{publishSvg}}</div><div style="font-size: 25px; display: inline; cursor: pointer" id="switchUser" title="{{login}}">{{userSvg}}</div><div style="font-size: 25px; display: {{uploadDisplay}}; cursor: pointer" id="uploadSource" title="{{add}}">{{uploadSvg}}</div><br>Powered By <a href="https://github.com/HappySeashell/momentide" target="_blank" rel="noopener">Momentide</a><br>{{version}}
</div>
<input type="file" id="realUpload" onchange="atEvery.prototype.beginUpload(this.files[0])" style="width: 0; height: 0; display: none">
